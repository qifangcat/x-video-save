name: Build and publish APK

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Validate tag and release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)+$ ]]
          grep -F "versionName '$version'" app/build.gradle
          test -f "release-notes/$GITHUB_REF_NAME.md"
      - name: Run quality-selection tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/test-classes
          javac -encoding UTF-8 -d build/test-classes app/src/main/java/dev/local/xvideosave/QualitySelector.java tests/QualitySelectorTest.java
          java -cp build/test-classes dev.local.xvideosave.QualitySelectorTest tests/quality-fixture.m3u8
      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          actual="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)"
          test "$actual" = '4adf2ac822f462cdcb16db98825011b4eeb923285d6f8324ba611299f016455f'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' </dev/null
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          test -f "$ANDROID_JAR"
          gradle --no-daemon --no-problems-report assembleDebug
      - name: Verify and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="x-video-save-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > build/apk-badging.txt
          grep -F "package: name='dev.local.xvideosave'" build/apk-badging.txt
          grep -F "versionName='${GITHUB_REF_NAME#v}'" build/apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > build/apk-signature.txt
          grep -Fi 'Signer #1 certificate SHA-256 digest: 4adf2ac822f462cdcb16db98825011b4eeb923285d6f8324ba611299f016455f' build/apk-signature.txt
          sha256sum "$apk" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "$apk" SHA256SUMS.txt --title "X 视频保存 $GITHUB_REF_NAME" --notes-file "release-notes/$GITHUB_REF_NAME.md" --verify-tag
