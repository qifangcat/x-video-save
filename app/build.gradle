plugins { id 'com.android.application' }
android { namespace 'dev.local.xvideosave'; compileSdk 36
 defaultConfig { applicationId 'dev.local.xvideosave'; minSdk 29; targetSdk 35; versionCode 4; versionName '0.4' }
 signingConfigs { debug {
  def keyPath = System.getenv("XVIDEOSAVE_SIGNING_KEYSTORE")
  if (keyPath) storeFile file(keyPath)
 } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    compileOnly project(':xposed-stubs')
    implementation('org.mp4parser:muxer:1.9.56') { exclude group: 'junit', module: 'junit' }
}
